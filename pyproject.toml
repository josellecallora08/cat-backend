[project]
name = "cat-backend"
version = "0.1.0"
description = "Collection Agent Trainer - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.22",
    "clamd>=1.0.2",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.scripts]
cat-backend-release-gate = "scripts.release_gate:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "S", "T20", "SIM", "TCH",
    "RUF", "ASYNC", "C4", "DTZ", "PIE", "RET", "PTH",
]
ignore = [
    "S101", "B008", "RET504",
    # The formatter intentionally leaves long strings/prompts intact.
    "E501",
    # Existing HTTP translation layers deliberately suppress exception chaining.
    "B904",
    # Legacy test helpers intentionally use nested contexts and broad validation assertions.
    "SIM117", "B017",
    # Protocol constants, test fixtures, and seed-only randomness are not credentials/crypto.
    "S105", "S311", "S603",
    # Preserve public API parameter names and late imports used to avoid import cycles.
    "A001", "A002", "E402",
    # Defer broad legacy style migrations that do not affect correctness.
    "SIM102", "SIM113", "PTH101", "PTH122", "PTH123",
    "DTZ001", "RUF002", "RUF043", "S110", "B023",
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**/*.py" = ["S101", "S106", "T20"]
"alembic/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true


include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
    "integration: tests requiring external services (ClamAV, PostgreSQL)",
    "db_integration: tests requiring a real PostgreSQL database connection",
    "http_e2e: HTTP-level report lifecycle tests against an isolated async database",
    "report: report contract, service, route, and export coverage",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/tests/*",
    "app/__pycache__/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
